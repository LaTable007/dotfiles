# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# It's not necessary to copy all keys to your config.
# If the key is missing in your config, "default-config.toml" will serve as a fallback

config-version = 2

# Keeps these workspaces registered even before they're ever visited, so
# `aerospace list-workspaces --all` (used by the sketchybar spaces widget)
# reports all of them from the start instead of only ones you've opened.
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

# Notify sketchybar's aerospace_mode item whenever main/service mode changes
on-mode-changed = ['exec-and-forget sketchybar --trigger aerospace_mode_change']

# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []


# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
#after-startup-command = [
#  'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0'
#]
# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
key-mapping.preset = 'qwerty'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE',
]

# Key notations are matched by physical position (US QWERTY reference), not
# by the character printed on the keycap. On Belgian/French AZERTY, the
# physical key after L is labeled 'M' (not ';'), the key showing ';' is
# physically where QWERTY has ',', and the key showing ',' is physically
# where QWERTY has 'M'. This realigns the notations to what's actually
# printed on your keys, so 'semicolon' fires the key labeled ; etc.
[key-mapping.key-notation-to-key-code]
m = 'semicolon'
semicolon = 'comma'
comma = 'm'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
# bar height 34 + bar y_offset 10 + 10px gap below the bar = 54,
# so the gap above the bar, below the bar, and around every tiled
# window (left/right/bottom/inner, all = 10 below) is the same 10px.
outer.top = 54
outer.right = 10

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right

# All possible modifiers: cmd, alt, ctrl, shift

# All possible commands: https://nikitabobko.github.io/AeroSpace/commands

# You can uncomment this line to open up terminal with alt + enter shortcut
# See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
# alt-enter = 'exec-and-forget open -n /System/Applications/Utilities/Terminal.app'

# Modifier: Hyper key (cmd-ctrl-alt-shift), sent by Raycast's "Hyper Key"
# feature when Caps Lock is held. This is deliberate: on AZERTY, plain
# Option/Alt is needed to type @ # { } [ ] | etc. (macOS treats left and
# right Option identically, there's no way to bind only one), and it also
# collides with LazyVim's <A-j>/<A-k> line-move mappings. A 4-modifier
# combo nothing else uses avoids both problems.
# See: https://nikitabobko.github.io/AeroSpace/guide#key-mapping

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
cmd-ctrl-alt-shift-slash = 'layout tiles horizontal vertical'
cmd-ctrl-alt-shift-comma = 'layout accordion horizontal vertical'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
cmd-ctrl-alt-shift-h = 'focus left'
cmd-ctrl-alt-shift-j = 'focus down'
cmd-ctrl-alt-shift-k = 'focus up'
cmd-ctrl-alt-shift-l = 'focus right'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
cmd-ctrl-alt-shift-1 = 'workspace 1'
cmd-ctrl-alt-shift-2 = 'workspace 2'
cmd-ctrl-alt-shift-3 = 'workspace 3'
cmd-ctrl-alt-shift-4 = 'workspace 4'
cmd-ctrl-alt-shift-5 = 'workspace 5'
cmd-ctrl-alt-shift-6 = 'workspace 6'
cmd-ctrl-alt-shift-7 = 'workspace 7'
cmd-ctrl-alt-shift-8 = 'workspace 8'
cmd-ctrl-alt-shift-9 = 'workspace 9'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
cmd-ctrl-alt-shift-tab = 'workspace-back-and-forth'

# Hyper already includes shift, so move/resize/move-to-workspace/join-with
# (which used alt-shift-* before) can't be direct chords anymore without a
# second physical modifier key. They live in 'service' mode instead: hit
# the chord once to enter, then a plain key does the action.
# See: https://nikitabobko.github.io/AeroSpace/commands#mode
cmd-ctrl-alt-shift-semicolon = 'mode service'


# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
#s = ['layout sticky tiling', 'mode main'] # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
f = [
  'layout floating tiling',
  'mode main',
] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

# move focused window (was alt-shift-h/j/k/l)
h = ['move left', 'mode main']
j = ['move down', 'mode main']
k = ['move up', 'mode main']
l = ['move right', 'mode main']

# resize (was alt-shift-minus/equal); stays in service mode so you can
# tap minus/equal repeatedly, esc to leave
minus = ['resize smart -50', 'mode service']
equal = ['resize smart +50', 'mode service']

# move window to workspace (was alt-shift-1..9)
1 = ['move-node-to-workspace 1 --focus-follows-window', 'mode main']
2 = ['move-node-to-workspace 2 --focus-follows-window', 'mode main']
3 = ['move-node-to-workspace 3 --focus-follows-window', 'mode main']
4 = ['move-node-to-workspace 4 --focus-follows-window', 'mode main']
5 = ['move-node-to-workspace 5 --focus-follows-window', 'mode main']
6 = ['move-node-to-workspace 6 --focus-follows-window', 'mode main']
7 = ['move-node-to-workspace 7 --focus-follows-window', 'mode main']
8 = ['move-node-to-workspace 8 --focus-follows-window', 'mode main']
9 = ['move-node-to-workspace 9 --focus-follows-window', 'mode main']

# move workspace to next monitor (was alt-shift-tab)
tab = ['move-workspace-to-monitor --wrap-around next', 'mode main']

shift-h = ['join-with left', 'mode main']
shift-j = ['join-with down', 'mode main']
shift-k = ['join-with up', 'mode main']
shift-l = ['join-with right', 'mode main']

[[on-window-detected]]
if.app-id = 'com.valvesoftware.steam.helper'
run = 'layout tiling'

[[on-window-detected]]
if.app-id = 'com.automattic.beeper.desktop'
run = 'layout tiling'
